<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CATAN - Verificacion de identidad</title>
<link rel="stylesheet" href="style.css">
<style>
/* ===== Pagina troll /amigos: estilos propios con prefijo am- ===== */

.am-screen { display: none; min-height: 100vh; align-items: center; justify-content: center; padding: 24px; }
.am-screen.active { display: flex; }

/* --- Selector de identidad --- */
.am-select-card {
  width: min(760px, 94vw);
  background: linear-gradient(180deg, var(--parchment), var(--parchment-dark));
  border: 3px solid #8a6534; border-radius: 16px;
  box-shadow: 0 24px 70px rgba(0,0,0,0.65);
  padding: 36px 40px; text-align: center;
  animation: capBoxIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
}
.am-select-card h1 { font-size: 40px; margin-bottom: 4px; }
.am-kicker { color: #7a6242; font-style: italic; margin-bottom: 22px; }
.am-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
}
.am-friend {
  background: #fffaf0; border: 2px solid #cbb37e; border-radius: 12px;
  padding: 16px 8px 12px;
  font-family: inherit; font-size: 17px; font-weight: 900; color: var(--ink);
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  box-shadow: 0 3px 8px rgba(0,0,0,0.15);
}
.am-friend:hover {
  transform: translateY(-5px) rotate(-1deg);
  border-color: var(--red-catan);
  box-shadow: 0 12px 22px rgba(0,0,0,0.3);
}
.am-friend .am-avatar {
  width: 58px; height: 58px; border-radius: 50%;
  margin: 0 auto 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  border: 3px solid rgba(0,0,0,0.25);
  box-shadow: inset 0 -4px 8px rgba(0,0,0,0.25);
}
.am-friend small { display: block; font-weight: normal; font-size: 11px; color: #8a6c46; font-style: italic; margin-top: 3px; }

/* --- Escenario generico --- */
.am-stage-card {
  width: min(640px, 94vw);
  background: linear-gradient(180deg, var(--parchment), var(--parchment-dark));
  border: 3px solid #8a6534; border-radius: 16px;
  box-shadow: 0 24px 70px rgba(0,0,0,0.65);
  padding: 34px 38px; text-align: center;
  animation: capBoxIn 0.45s cubic-bezier(0.34,1.56,0.64,1) both;
}
.am-stage-card h2 { color: var(--red-catan); font-size: 26px; margin-bottom: 10px; }
.am-stage-card p { font-size: 16px; line-height: 1.55; color: var(--ink); }
.am-row { display: flex; gap: 12px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
.am-note { font-size: 12.5px; color: #8a6c46; font-style: italic; margin-top: 14px; }

/* --- Fernando VIP --- */
body.theme-vip { background: radial-gradient(ellipse at 50% 20%, #6a4a12, #2d1b0d 70%); }
.theme-vip .am-stage-card {
  border-color: #e8b64c;
  box-shadow: 0 0 60px rgba(232,182,76,0.35), 0 24px 70px rgba(0,0,0,0.65);
}

/* --- Diego banca privada --- */
body.theme-banco {
  background: linear-gradient(180deg, #0c1b2e 0%, #12263d 60%, #0a1524 100%);
}
.theme-banco .am-stage-card {
  background: linear-gradient(180deg, #f8f6f0, #ece7da);
  border-color: #b89a55;
  font-family: Georgia, 'Times New Roman', serif;
}
.theme-banco .am-stage-card h2 { color: #0c1b2e; letter-spacing: 1px; }
.am-banco-logo { font-size: 13px; letter-spacing: 4px; color: #b89a55; font-weight: 900; margin-bottom: 14px; }
.am-wealth-bar {
  height: 26px; border-radius: 6px; overflow: hidden;
  background: #dcd5c2; border: 1px solid #b89a55; margin: 18px 0 6px;
  display: flex;
}
.am-wealth-fill {
  background: linear-gradient(90deg, #b89a55, #e2c377);
  width: 100%;
  display: flex; align-items: center; justify-content: flex-end;
  color: #0c1b2e; font-weight: 900; font-size: 13px; padding-right: 8px;
  transition: width 2.2s cubic-bezier(0.6, 0, 0.3, 1);
}

/* --- Gaston potas --- */
body.theme-potas { background: radial-gradient(ellipse at 50% 30%, #14381f, #0a1f10 75%); }
.am-pota-slider { width: 100%; margin: 20px 0 6px; accent-color: #2fae4e; height: 30px; }
.am-pota-count { font-size: 54px; font-weight: 900; color: #1d8f3c; line-height: 1; }
.am-pota-verdict { min-height: 26px; font-weight: bold; font-size: 16px; color: var(--red-catan); margin-top: 8px; }
.am-pota-rain { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
.am-pota-rain span { position: absolute; top: -60px; animation: amPotaFall linear both; }
@keyframes amPotaFall {
  to { transform: translateY(115vh) rotate(720deg); }
}

/* --- Agustin: boda + Escocia --- */
body.theme-boda { background: radial-gradient(ellipse at 50% 25%, #4a3550, #241628 75%); }
.am-invite {
  border: 3px double #b89ac4 !important;
  position: relative;
}
.am-invite::before, .am-invite::after {
  content: '❦'; position: absolute; font-size: 26px; color: #8e5aa8;
}
.am-invite::before { top: 10px; left: 16px; }
.am-invite::after { bottom: 10px; right: 16px; }
.am-invite h2 { font-size: 30px !important; color: #6a4a78 !important; }
.am-invite .am-script { font-style: italic; font-size: 19px; line-height: 1.7; }

body.theme-escocia {
  background:
    repeating-linear-gradient(0deg, rgba(180,30,40,0.16) 0 22px, transparent 22px 46px, rgba(240,220,90,0.06) 46px 52px, transparent 52px 90px),
    repeating-linear-gradient(90deg, rgba(180,30,40,0.16) 0 22px, transparent 22px 46px, rgba(240,220,90,0.06) 46px 52px, transparent 52px 90px),
    linear-gradient(180deg, #16351f 0%, #0e2415 100%);
}
.am-scot-scape {
  position: fixed; bottom: 0; left: 0; right: 0; height: 30vh;
  pointer-events: none; z-index: 0;
}
.theme-escocia .am-stage-card { position: relative; z-index: 2; border-color: #b0a060; }
.am-kilt { margin: 14px auto 4px; display: block; }
.am-float { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
.am-float span { position: absolute; bottom: -60px; animation: amFloatUp linear both; }
@keyframes amFloatUp {
  to { transform: translateY(-115vh) rotate(40deg); }
}

/* --- Lucas: India total --- */
body.theme-india {
  background: linear-gradient(180deg, #f9963a 0%, #f6a94e 32%, #f5efe2 33%, #f5efe2 66%, #2e8b57 67%, #1e6e42 100%);
}
.am-chakra {
  position: fixed; top: 50%; left: 50%;
  width: 340px; height: 340px; margin: -170px 0 0 -170px;
  border: 10px solid rgba(26, 60, 120, 0.16); border-radius: 50%;
  pointer-events: none; z-index: 0;
  animation: amChakraSpin 24s linear infinite;
}
.am-chakra::before {
  content: ''; position: absolute; inset: -10px;
  background: repeating-conic-gradient(rgba(26,60,120,0.16) 0deg 2.5deg, transparent 2.5deg 15deg);
  border-radius: 50%;
  -webkit-mask: radial-gradient(circle, transparent 58%, #000 59%, #000 100%);
          mask: radial-gradient(circle, transparent 58%, #000 59%, #000 100%);
}
@keyframes amChakraSpin { to { transform: rotate(360deg); } }
.am-taj {
  position: fixed; bottom: 0; left: 0; right: 0; height: 26vh;
  pointer-events: none; z-index: 1; opacity: 0.9;
}
.theme-india .am-stage-card {
  position: relative; z-index: 2;
  border-color: #d4881f;
  box-shadow: 0 0 50px rgba(249, 150, 58, 0.4), 0 24px 70px rgba(0,0,0,0.5);
}
.theme-india .am-stage-card h2 { color: #c05a10; }
.am-garland {
  position: fixed; top: -6px; left: 0; right: 0; text-align: center;
  font-size: 26px; letter-spacing: 6px; z-index: 3; pointer-events: none;
  text-shadow: 0 3px 4px rgba(0,0,0,0.25);
}
.am-curry-scale {
  display: flex; justify-content: space-between; font-size: 12px;
  color: #8a6c46; margin-top: 2px; font-weight: bold;
}
.am-cow {
  position: absolute; font-size: 58px; z-index: 5;
  filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
  transition: transform 2.2s ease-in-out;
  pointer-events: none;
}
.am-cow-bubble {
  position: absolute; top: -26px; left: 50px;
  background: #fff; border: 2px solid #3a2a18; border-radius: 10px;
  font-size: 13px; font-weight: bold; padding: 2px 10px; white-space: nowrap;
  opacity: 0; transition: opacity 0.3s;
}

/* --- Martin: cursor con menisco roto --- */
body.theme-canarias {
  background: linear-gradient(180deg, #3a7ca8 0%, #6fb3d4 55%, #e8d9a8 56%, #d4be85 100%);
  cursor: none !important;
}
body.theme-canarias * { cursor: none !important; }
#am-cursor {
  position: fixed; z-index: 200; pointer-events: none;
  width: 30px; height: 30px; top: 0; left: 0;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
}
#am-cursor .am-venda { position: absolute; right: -8px; bottom: -4px; font-size: 15px; display: none; }
.am-freeze {
  position: fixed; inset: 0; z-index: 150;
  background: rgba(20, 30, 40, 0.55);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(2px) grayscale(0.6);
}
.am-diag-bar {
  height: 18px; border-radius: 9px; background: #dcd5c2;
  border: 1px solid #8a6534; overflow: hidden; margin: 14px 0;
}
.am-diag-fill {
  height: 100%; width: 0%;
  background: repeating-linear-gradient(45deg, #5a8aa8 0 12px, #4a7a98 12px 24px);
  transition: width 3s linear;
}
.am-hora-canaria {
  position: fixed; top: 14px; right: 16px; z-index: 6;
  background: rgba(255,250,240,0.92); border: 2px solid #8a6534; border-radius: 10px;
  padding: 6px 14px; font-size: 13px; font-weight: bold; color: var(--ink);
}

/* --- Ruibal: contrato --- */
body.theme-legal { background: radial-gradient(ellipse at 50% 20%, #4a4238, #26221c 75%); }
.am-contrato {
  background: linear-gradient(180deg, #f6efdc, #ece0c2) !important;
  font-family: 'Courier New', Courier, monospace !important;
  text-align: left !important;
  max-height: 88vh; overflow-y: auto;
}
.am-contrato h2 {
  font-family: 'Courier New', Courier, monospace !important;
  color: #26221c !important; text-align: center;
  font-size: 20px !important; letter-spacing: 1px;
  border-bottom: 2px solid #26221c; padding-bottom: 8px;
}
.am-contrato p { font-size: 13.5px !important; line-height: 1.65 !important; }
.am-clausula { margin-top: 10px; }
.am-clausula b { text-decoration: underline; }
.am-firma-zone {
  margin-top: 16px; border: 2px dashed #8a6534; border-radius: 8px;
  background: #fffaf0; position: relative;
}
.am-firma-zone canvas { display: block; width: 100%; height: 120px; touch-action: none; }
.am-firma-hint {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: #b8a878; font-style: italic; pointer-events: none; font-size: 14px;
}
.am-sello {
  position: absolute; right: 18px; top: -14px;
  border: 4px solid #a32c22; color: #a32c22;
  font-weight: 900; font-size: 20px; letter-spacing: 2px;
  padding: 4px 14px; border-radius: 8px; transform: rotate(9deg);
  background: rgba(255,250,240,0.85);
  animation: amStamp 0.4s cubic-bezier(0.2, 2.2, 0.4, 1) both;
}

/* --- Final compartido --- */
.am-stamp {
  display: inline-block;
  border: 5px solid #3d9142; color: #3d9142;
  font-size: 42px; font-weight: 900; letter-spacing: 4px;
  padding: 8px 28px; border-radius: 10px;
  transform: rotate(-8deg);
  animation: amStamp 0.5s cubic-bezier(0.2, 2.2, 0.4, 1) 0.3s both;
  text-transform: uppercase;
}
@keyframes amStamp {
  from { transform: rotate(-8deg) scale(3); opacity: 0; }
  to   { transform: rotate(-8deg) scale(1); opacity: 1; }
}
#am-dodge { position: relative; transition: left 0.15s ease-out, top 0.15s ease-out; left: 0; top: 0; }
.am-punch { display: none; margin-top: 16px; font-size: 17px; font-weight: 900; color: var(--red-catan); }
</style>
</head>
<body>

<!-- ===== Selector ===== -->
<div id="am-select" class="am-screen active">
  <div class="am-select-card">
    <h1 class="game-title small">CATAN</h1>
    <p class="am-kicker">Verificacion de identidad obligatoria. Selecciona quien sos. Se honesto: sabemos todo.</p>
    <div class="am-grid" id="am-grid"></div>
    <p class="am-note">Sistema de Admision Colonos v2.1 · Los datos seran usados en tu contra</p>
  </div>
</div>

<!-- ===== Escenario ===== -->
<div id="am-stage" class="am-screen"></div>

<script src="/vendor/gsap.min.js"></script>
<script src="captcha.js"></script>
<script>
(function () {
  'use strict';

  const FRIENDS = [
    { id: 'fernando', name: 'Fernando', emoji: '👑', color: '#e8b64c', hint: 'el fundador' },
    { id: 'diego', name: 'Diego', emoji: '💰', color: '#2471a3', hint: 'sector premium' },
    { id: 'gaston', name: 'Gaston', emoji: '🧪', color: '#2fae4e', hint: 'full bajo torre' },
    { id: 'ruibal', name: 'Ruibal', emoji: '🏠', color: '#c0392b', hint: 'magnate inmobiliario' },
    { id: 'agustin', name: 'Agustin', emoji: '💍', color: '#8e5aa8', hint: 'comprometido' },
    { id: 'lucas', name: 'Lucas', emoji: '🍛', color: '#e67e22', hint: 'namaste' },
    { id: 'martin', name: 'Martin', emoji: '🦵', color: '#5a8aa8', hint: 'en reposo deportivo' },
  ];

  const grid = document.getElementById('am-grid');
  const stage = document.getElementById('am-stage');
  const selectScreen = document.getElementById('am-select');

  for (const f of FRIENDS) {
    const btn = document.createElement('button');
    btn.className = 'am-friend';
    btn.innerHTML = `<div class="am-avatar" style="background:${f.color}">${f.emoji}</div>${f.name}<small>${f.hint}</small>`;
    btn.addEventListener('click', () => start(f.id));
    grid.appendChild(btn);
  }

  function show(html, themeClass) {
    document.body.className = themeClass || '';
    selectScreen.classList.remove('active');
    stage.innerHTML = html;
    stage.classList.add('active');
  }

  function start(id) {
    ({ fernando, diego, gaston, ruibal, agustin, lucas, martin })[id]();
  }

  // ============ FINAL COMPARTIDO: el boton esquiva ============

  function showEnd(extra) {
    show(`
      <div class="am-stage-card">
        <div class="am-stamp">Aprobado</div>
        <h2 style="margin-top:18px">Verificacion de identidad completa</h2>
        <p>${extra || 'Cumplis los requisitos minimos para colonizar Catan.'}</p>
        <div class="am-row" style="min-height:70px">
          <button class="btn btn-primary" id="am-dodge">Entrar a la partida</button>
        </div>
        <p class="am-punch" id="am-punch">El link real lo tiene Fernando. Siempre lo tuvo. 😌</p>
      </div>`);
    const btn = document.getElementById('am-dodge');
    let dodges = 0;
    btn.addEventListener('mouseenter', () => {
      dodges++;
      if (dodges > 5) {
        btn.style.display = 'none';
        document.getElementById('am-punch').style.display = 'block';
        return;
      }
      btn.style.left = (Math.random() * 360 - 180) + 'px';
      btn.style.top = (Math.random() * 90 - 30) + 'px';
    });
    btn.addEventListener('click', () => {
      // por si lo agarra con el teclado o un toque rapido
      btn.style.display = 'none';
      document.getElementById('am-punch').style.display = 'block';
    });
  }

  // ============ FERNANDO ============

  function fernando() {
    show(`
      <div class="am-stage-card">
        <h2 style="color:#a3721a">👑 Identidad confirmada</h2>
        <p><b>Bienvenido, fundador.</b> El sistema no verifica al que lo diseño.</p>
        <p style="margin-top:10px">Acceso VIP concedido. Alfombra roja desplegada. Los subditos fueron notificados.</p>
        <div class="am-row">
          <button class="btn btn-primary" id="am-fer-ok">Proceder con elegancia</button>
        </div>
      </div>`, 'theme-vip');
    document.getElementById('am-fer-ok').addEventListener('click', () =>
      showEnd('Vos tenes el link real. Esto era para verlos sufrir a ellos.'));
  }

  // ============ DIEGO: banca privada ============

  function diego() {
    show(`
      <div class="am-stage-card">
        <div class="am-banco-logo">BANCO DE CATAN · PRIVATE WEALTH</div>
        <h2>Estimado cliente Diego,</h2>
        <p style="text-align:left">Nuestro equipo de analistas detecto que usted posee <b>el patrimonio mas alto del grupo</b>: como es el unico con plata de verdad, la banca lo felicita y lamenta informarle lo siguiente.</p>
        <p style="text-align:left; margin-top:10px">En pos de la <i>equidad colonizadora</i>, este juego aplicara sobre su cuenta el <b>Impuesto Progresivo al Cheto (IPC)</b>: comenzara la partida con <b>LA MITAD de los recursos</b>.</p>
        <div class="am-wealth-bar"><div class="am-wealth-fill" id="am-wealth">100%</div></div>
        <p class="am-note" style="text-align:right">patrimonio auditado en tiempo real</p>
        <div class="am-row">
          <button class="btn" id="am-diego-apelar">Apelar</button>
          <button class="btn btn-primary" id="am-diego-ok">Aceptar mi destino</button>
        </div>
        <p class="am-pota-verdict" id="am-diego-msg"></p>
      </div>`, 'theme-banco');

    // el patrimonio se desangra en vivo
    setTimeout(() => {
      const bar = document.getElementById('am-wealth');
      bar.style.width = '50%';
      bar.textContent = '50%';
    }, 600);

    let apelaciones = 0;
    const msgs = [
      'Apelacion rechazada. Firmado: El Socialismo.',
      'Segunda apelacion rechazada. El country no es jurisdiccion valida.',
      'Su abogado tambien voto a favor del impuesto.',
    ];
    document.getElementById('am-diego-apelar').addEventListener('click', () => {
      document.getElementById('am-diego-msg').textContent = msgs[Math.min(apelaciones++, msgs.length - 1)];
    });
    document.getElementById('am-diego-ok').addEventListener('click', () =>
      showEnd('Recursos iniciales: 50%. La revolucion te saluda, Diego.'));
  }

  // ============ GASTON: Magela -> potas -> captcha ============

  function gaston() {
    show(`
      <div class="am-stage-card">
        <h2>🧪 Hola Gaston</h2>
        <p>Antes de empezar, una pregunta de seguridad:</p>
        <p style="font-size:22px; font-weight:900; margin-top:14px">¿Magela te dejo jugar?</p>
        <div class="am-row">
          <button class="btn btn-primary" id="am-gas-si">Si, tengo permiso</button>
          <button class="btn" id="am-gas-no">No</button>
        </div>
        <p class="am-pota-verdict" id="am-gas-msg"></p>
      </div>`, 'theme-potas');

    document.getElementById('am-gas-no').addEventListener('click', () => {
      const msg = document.getElementById('am-gas-msg');
      msg.textContent = 'Anda a pedirle permiso. Te esperamos aca, tranquilos.';
      const btn = document.getElementById('am-gas-si');
      btn.disabled = true;
      let s = 10;
      btn.textContent = `Pidiendo permiso... ${s}`;
      const iv = setInterval(() => {
        s--;
        btn.textContent = s > 0 ? `Pidiendo permiso... ${s}` : 'Ya me dejo (mentira no le pregunte)';
        if (s <= 0) { btn.disabled = false; clearInterval(iv); }
      }, 1000);
    });
    document.getElementById('am-gas-si').addEventListener('click', gastonPotas);
  }

  function gastonPotas() {
    show(`
      <div class="am-stage-card">
        <h2>🧪 Plan de hidratacion</h2>
        <p>¿Cuantas potas te vas a tomar en esta partida?</p>
        <div class="am-pota-count" id="am-pota-n">0</div>
        <input type="range" min="0" max="99" value="0" class="am-pota-slider" id="am-pota-slider">
        <p class="am-pota-verdict" id="am-pota-verdict">Move el slider, no te hagas el sano.</p>
        <div class="am-row">
          <button class="btn btn-primary" id="am-pota-ok" disabled>Confirmar dosis</button>
        </div>
      </div>`, 'theme-potas');

    const slider = document.getElementById('am-pota-slider');
    const count = document.getElementById('am-pota-n');
    const verdict = document.getElementById('am-pota-verdict');
    const ok = document.getElementById('am-pota-ok');
    const rain = document.createElement('div');
    rain.className = 'am-pota-rain';
    document.body.appendChild(rain);

    const verdicts = [
      [0, 'Move el slider, no te hagas el sano.'],
      [1, '¿Una sola? ¿Estas enfermo?'],
      [5, 'Tibio. Muy tibio.'],
      [15, 'Ahi esta el Gaston que conocemos.'],
      [30, 'El higado presento su renuncia.'],
      [50, 'Farmacity te nombro cliente del año.'],
      [80, 'MODO BAJO TORRE PERMANENTE ACTIVADO.'],
      [99, '99 potas. Magela ya fue notificada.'],
    ];
    let lastRain = 0;
    slider.addEventListener('input', () => {
      const v = Number(slider.value);
      count.textContent = v;
      ok.disabled = v === 0;
      let text = verdicts[0][1];
      for (const [min, t] of verdicts) if (v >= min) text = t;
      verdict.textContent = text;
      // llueven potas proporcionalmente
      if (v > lastRain) {
        for (let i = 0; i < Math.min(3, v - lastRain); i++) {
          const drop = document.createElement('span');
          drop.textContent = '🧪';
          drop.style.left = Math.random() * 100 + 'vw';
          drop.style.fontSize = 18 + Math.random() * 26 + 'px';
          drop.style.animationDuration = 2.5 + Math.random() * 2 + 's';

  function martin() {
    show(`
      <div class="am-stage-card">
        <h2>🦵 Hola Martin</h2>
        <p>Detectamos que te conectas desde <b>Canarias</b>. Ajustando reloj...</p>
        <p style="margin-top:12px">Antes de entrar necesitamos <b>calibrar tu cursor</b>.<br>

      </div>`, 'theme-canarias');

    document.body.insertAdjacentHTML('beforeend',
      `<div class="am-hora-canaria">🕐 Hora canaria: una menos, como siempre</div>`);

    // cursor falso lento: persigue al mouse con lerp muy vago
    const cur = document.createElement('div');
    cur.id = 'am-cursor';
    cur.innerHTML = `<svg width="30" height="30" viewBox="0 0 28 28">
      <g stroke="#3a2a18" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round">
        <path fill="#f6ead0" d="M11.2 26 C9.4 26 8.2 25 7.4 23.4 L4.8 18.2 C4.2 17 4.6 15.8 5.6 15.3 C6.5 14.8 7.6 15.1 8.3 16.1 L9.5 17.8 L9.5 5.4 C9.5 4.1 10.4 3.2 11.5 3.2 C12.6 3.2 13.5 4.1 13.5 5.4 L13.5 12.2 L14.6 12.0 C15.6 11.8 16.5 12.4 16.8 13.3 L17.0 13.9 C17.8 13.6 18.8 13.9 19.3 14.7 L19.5 15.1 C20.4 14.9 21.4 15.4 21.7 16.3 L22.6 19.6 C23.3 22.3 21.8 25 19.2 25.8 C18.5 26 17.7 26 16.9 26 Z"/>
      </g></svg><span class="am-venda">🩹</span>`;
    document.body.appendChild(cur);

    let mx = innerWidth / 2, my = innerHeight / 2;
    let cx = mx, cy = my;
    let traveled = 0;
    let lastX = mx, lastY = my;
    let frozen = false;

    addEventListener('pointermove', (e) => {
      if (frozen) return;
      traveled += Math.hypot(e.clientX - lastX, e.clientY - lastY);
      lastX = e.clientX;
      lastY = e.clientY;
      mx = e.clientX;
      my = e.clientY;
    });

    (function follow() {
      // lerp bien vago: el cursor rengueando detras del mouse
      cx += (mx - cx) * 0.045;
      cy += (my - cy) * 0.045;
      cur.style.transform = `translate(${cx}px, ${cy}px)`;
      requestAnimationFrame(follow);
    })();

    // tras suficiente recorrido, el cursor "se lesiona"
    const check = setInterval(() => {
      if (traveled > 2600 && !frozen) {
        frozen = true;
        clearInterval(check);
        martinLesion();
      }
    }, 400);
  }

            <b>📋 Informe medico</b><br>

            Diagnostico: <b>rotura de menisco</b> (compatible con dribbling excesivo)<br>

          </div>
          <div class="am-row" id="am-diag-continue" style="display:none">
            <button class="btn btn-primary" id="am-diag-ok">Aceptar la lesion</button>
          </div>
        </div>
      </div>`);

    document.getElementById('am-diag-btn').addEventListener('click', function () {
      this.disabled = true;
      this.textContent = 'Haciendo resonancia...';
      document.getElementById('am-diag').style.width = '100%';
      setTimeout(() => {
        document.getElementById('am-diag-result').style.display = 'block';
        document.getElementById('am-diag-continue').style.display = 'flex';
        document.querySelector('#am-cursor .am-venda').style.display = 'block'; // vendita
      }, 3200);
    });
    document.getElementById('am-diag-ok').addEventListener('click', () => {
      document.getElementById('am-freeze').remove();
      showEnd('Podes jugar, pero el cursor sigue lento: esta en recuperacion. Saludos a Canarias. 🩹');
    });
  }

  function ruibal() {
    show(`
      <div class="am-stage-card am-contrato">
        <h2>CONTRATO DE DONACION IRREVOCABLE<br>EXPEDIENTE N° 57-8/2026</h2>
        <p class="am-clausula"><b>COMPARECE:</b> el Sr. RUIBAL, en adelante "EL TERRATENIENTE", quien acredita mediante escrituras, boletas de OSE y puro caradurismo la titularidad de CINCUENTA Y SIETE (57) inmuebles.</p>

        <p class="am-clausula"><b>CLAUSULA SEGUNDA:</b> EL TERRATENIENTE se compromete a no llorar por ello, ni mencionarlo en asados, ni usarlo como excusa cuando pierda en el Catan.</p>
        <p class="am-clausula"><b>CLAUSULA TERCERA:</b> queda inhabilitado DE POR VIDA para jugar al Monopoly, por razones obvias de conflicto de interes.</p>
        <p class="am-clausula"><b>CLAUSULA CUARTA:</b> sin la firma del presente, el acceso al juego permanecera BLOQUEADO. El escribano tiene todo el dia.</p>
        <div class="am-firma-zone" id="am-firma-zone">
          <canvas id="am-firma" width="520" height="120"></canvas>
          <div class="am-firma-hint" id="am-firma-hint">Firme aqui con el mouse, señor terrateniente</div>
        </div>
        <div class="am-row">
          <button class="btn" id="am-ruibal-borrar">Borrar firma</button>
          <button class="btn btn-primary" id="am-ruibal-firmar">Protocolizar y entrar</button>
        </div>
        <p class="am-pota-verdict" id="am-ruibal-msg"></p>
      </div>`, 'theme-legal');

    const canvas = document.getElementById('am-firma');
    const zone = document.getElementById('am-firma-zone');
    const hint = document.getElementById('am-firma-hint');
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = '#26221c';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    let drawing = false;
    let ink = 0;

    const posOf = (e) => {
      const r = canvas.getBoundingClientRect();
      return { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) };
    };
    canvas.addEventListener('pointerdown', (e) => {
      drawing = true;
      canvas.setPointerCapture(e.pointerId);
      const p = posOf(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      hint.style.display = 'none';
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!drawing) return;
      const p = posOf(e);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      ink++;
    });
    canvas.addEventListener('pointerup', () => { drawing = false; });

    document.getElementById('am-ruibal-borrar').addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ink = 0;
      hint.style.display = 'flex';
      document.getElementById('am-ruibal-msg').textContent = '¿Se arrepintio? Las 8 casas lo siguen esperando.';
    });

    let intentos = 0;
    const rechazos = [
      'Sin firma no hay juego. El escribano lo esta mirando fijo.',
      'Eso no es una firma, es un suspiro. Firme con conviccion.',
      'El escribano suspiro. Intente de nuevo, con las 57 escrituras en la mano.',
    ];
    document.getElementById('am-ruibal-firmar').addEventListener('click', () => {
      if (ink < 40) {
        document.getElementById('am-ruibal-msg').textContent = rechazos[Math.min(intentos++, rechazos.length - 1)];
        return;
      }
      zone.insertAdjacentHTML('beforeend', '<div class="am-sello">PROTOCOLIZADO</div>');
      document.getElementById('am-ruibal-msg').textContent = 'Donacion registrada. Los gurises agradecen.';
      setTimeout(() =>
        showEnd('8 casas menos, te quedan 49. Vas a estar bien. Los gurises ya eligieron las mejores.'), 1800);
    });
  }

  // QA directo: /amigos?who=gaston
  const who = new URLSearchParams(location.search).get('who');
  if (who && FRIENDS.some((f) => f.id === who)) start(who);
